image: docker:20.10.14

build spiir:
  script:
    - cp /artifacts/iir_* . && cp /artifacts/*.patch .
    - DOCKER_BUILDKIT=1 docker build
      -t spiir:${CI_COMMIT_REF_SLUG}
      -f spiir.Dockerfile
      --progress=plain
      --build-arg BUILDKIT_INLINE_CACHE=1
      '.'
  tags:
    - spiir,gpu
  only:
    - merge_requests

check pep8 standards:
  image: python:2.7
  before_script:
    - /usr/local/bin/python -m pip install --upgrade pip
    - pip install yapf

  script:
    - git diff --relative HEAD~1
    - if git diff -U0 --no-color --relative HEAD~1 | yapf-diff --style pep8 | grep '' ; then false; else true; fi
  only:
    - merge_requests

check clang standards:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y clang-format-9 git-core
  script:
    - echo `which clang-format-9`
    - ln -s `which clang-format-9` /usr/bin/clang-format
    - cd gstlal-spiir
    - linter_errors=$(git-clang-format-9 --commit "HEAD~1" -q --diff | grep -v --color=never "no modified files to format" || true)
    - echo "$linter_errors"
    - if [ ! -z "$linter_errors" ]; then echo "Detected clang formatting issues; please fix"; exit 1; else echo "Clang formatting is correct"; exit 0; fi
  only:
    - merge_requests
