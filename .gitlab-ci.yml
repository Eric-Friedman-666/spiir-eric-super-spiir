image: docker:20.10.14

build spiir:
  script:
    - cp /artifacts/iir_* . && cp /artifacts/*.patch .
    - DOCKER_BUILDKIT=1 docker build
      -t spiir:${CI_COMMIT_REF_SLUG}
      -f spiir.Dockerfile
      --progress=plain
      --build-arg BUILDKIT_INLINE_CACHE=1
      '.'
  tags:
    - spiir,gpu
  only:
    - merge_requests

check pep8 standards:
  image: python:2.7
  before_script:
    - /usr/local/bin/python -m pip install --upgrade pip
    - pip install yapf
  script:
    - cd gstlal-spiir
    - linter_errors=$(git diff -U0 --no-color --relative origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME | yapf-diff --style pep8)
    - echo "$linter_errors"
    - if [ ! -z "$linter_errors" ]; then echo "Detected yapf formatting issues; please fix"; exit 1; else echo "Yapf formatting is correct"; exit 0; fi
  only:
    - merge_requests

check clang standards:
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y clang-format-14 git-core
  script:
    - cd gstlal-spiir
    - linter_errors=$(git-clang-format-14 --binary clang-format-14 --commit origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME -q --diff | grep -v --color=never "no modified files to format" || true)
    - echo "$linter_errors"
    - if [ ! -z "$linter_errors" ]; then echo "Detected clang formatting issues; please fix"; exit 1; else echo "Clang formatting is correct"; exit 0; fi
  only:
    - merge_requests
