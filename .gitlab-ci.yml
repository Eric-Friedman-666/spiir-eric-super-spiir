image: docker:20.10.14

build spiir:
  script:
    - cp /artifacts/iir_* . && cp /artifacts/*.patch .
    - DOCKER_BUILDKIT=1 docker build
      -t spiir:${CI_COMMIT_REF_SLUG}
      -f spiir.Dockerfile
      --progress=plain
      --build-arg BUILDKIT_INLINE_CACHE=1
      '.'
  tags:
    - spiir,gpu
  only:
    - merge_requests

check pep8 standards:
  image: python:2.7
  before_script:
    - /usr/local/bin/python -m pip install --upgrade pip
    - pip install yapf
  script:
    - cd gstlal-spiir
    - linter_errors=$(git diff -U0 --no-color --relative origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME | yapf-diff --style pep8)
    - echo "$linter_errors"
    - if [ ! -z "$linter_errors" ]; then echo "Detected yapf formatting issues; please fix"; exit 1; else echo "Yapf formatting is correct"; exit 0; fi
  only:
    - merge_requests

check clang standards:
  # ligo gitlab runners do not have the latest version of ubuntu:22.04 pulled, which does not include clang-format-9
  # Therefore we must specify specific latest ubuntu sha, until we can enforce an always pull_policy https://gitlab.com/gitlab-org/gitlab/-/issues/21619
  image: ubuntu@sha256:aa6c2c047467afc828e77e306041b7fa4a65734fe3449a54aa9c280822b0d87d # ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y clang-format-9 git-core
  script:
    - echo `which clang-format-9`
    - ln -s `which clang-format-9` /usr/bin/clang-format
    - cd gstlal-spiir
    - linter_errors=$(git-clang-format-9 --commit origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME -q --diff | grep -v --color=never "no modified files to format" || true)
    - echo "$linter_errors"
    - if [ ! -z "$linter_errors" ]; then echo "Detected clang formatting issues; please fix"; exit 1; else echo "Clang formatting is correct"; exit 0; fi
  only:
    - merge_requests
